<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <title>SleepNow</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    input[type="time"] {
      font-size: 1.2rem;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background-color: #007aff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fcc;
    }
    .results {
      margin-top: 20px;
    }
    .sleep-time {
      font-size: 1.1rem;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>A que horas você quer acordar?</h1>
    <input type="time" id="wakeTime" />
    <button onclick="calculateTimes()">Calcular</button>
    <div class="results" id="results"></div>
  </div>
  <script>
    function calculateTimes() {
      const input = document.getElementById("wakeTime").value;
      const results = document.getElementById("results");
      if (!input) return;

      const [hour, minute] = input.split(":").map(Number);
      const wakeDate = new Date();
      wakeDate.setHours(hour, minute, 0, 0);

      const cycles = 6;
      const cycleMinutes = 90;
      const fallAsleepBuffer = 15;

      let output = `<h2>Para acordar às ${input}, durma às:</h2>`;
      for (let i = cycles; i >= 1; i--) {
        const totalMinutes = i * cycleMinutes + fallAsleepBuffer;
        const sleepTime = new Date(wakeDate.getTime() - totalMinutes * 60000);
        let h = sleepTime.getHours().toString().padStart(2, "0");
        let m = sleepTime.getMinutes().toString().padStart(2, "0");
        output += `<div class="sleep-time">${h}:${m} (${i} ciclos)</div>`;
      }
      results.innerHTML = output;
    }
  </script>
</body>
</html>
